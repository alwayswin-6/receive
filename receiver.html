<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi-user Screen Receiver</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        background: #0d1117;
        color: #f5f5f5;
        padding: 16px;
      }
      .panel {
        width: min(1400px, 100%);
        margin: 0 auto;
        background: #161b22;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 1.2rem;
      }
      .meta {
        color: #8b949e;
        margin-bottom: 14px;
        font-size: 0.95rem;
      }
      .device-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 14px;
      }
      .device-card {
        border: 1px solid #30363d;
        background: #0f1723;
        border-radius: 12px;
        padding: 10px;
        cursor: pointer;
        text-align: left;
        color: inherit;
      }
      .device-card:hover {
        border-color: #58a6ff;
      }
      .image-wrap {
        aspect-ratio: 16 / 10;
        border-radius: 10px;
        overflow: hidden;
        background: #0b1220;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        border: 1px solid #30363d;
      }
      .device-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .device-card .title {
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 4px;
        word-break: break-all;
      }
      .device-card .detail {
        color: #8b949e;
        font-size: 0.82rem;
        line-height: 1.3;
      }
      .empty-state {
        grid-column: 1 / -1;
        border: 1px dashed #444c56;
        color: #8b949e;
        border-radius: 10px;
        padding: 28px;
        text-align: center;
      }
      .device-card.expanded {
        position: fixed;
        inset: 0;
        width: auto;
        height: auto;
        z-index: 100;
        background: rgba(0, 0, 0, 0.97);
        border-radius: 0;
        border: none;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .device-card.expanded .image-wrap {
        flex: 1;
        aspect-ratio: auto;
        border-radius: 12px;
      }
      .device-card.expanded .title {
        font-size: 1.05rem;
      }
      .device-card.expanded .detail {
        font-size: 0.9rem;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Multi-user Screen Receiver</h1>
      <div id="meta" class="meta">Waiting for screens to arrive...</div>
      <div id="deviceGrid" class="device-grid"></div>
    </div>

    <script>
      const deviceGrid = document.getElementById('deviceGrid');
      const meta = document.getElementById('meta');
      let expandedDeviceId = null;
      let lastPayload = null;

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;');
      }

      function renderDevices(devices) {
        if (!devices.length) {
          if (!deviceGrid.querySelector('.empty-state')) {
            deviceGrid.innerHTML = '<div class="empty-state">No WebRTC screens have been received yet.</div>';
          }
          return;
        }

        const emptyState = deviceGrid.querySelector('.empty-state');
        if (emptyState) {
          emptyState.remove();
        }

        const existingCards = new Map(
          Array.from(deviceGrid.querySelectorAll('.device-card')).map((card) => [card.dataset.deviceId, card])
        );
        let previousCard = null;

        devices.forEach((device) => {
          const deviceId = device.safe_device_id || device.device_id || 'unknown';
          const title = device.device_id || device.safe_device_id || 'Unknown device';
          const timestamp = device.timestamp || 'Unknown time';
          const source = device.source || 'unknown';
          const signal = device.signal || device.webrtc || {};
          const signalType = signal.type || device.type || 'offer';
          const isExpanded = expandedDeviceId === deviceId;
          const cacheBust = `?_=${Date.now()}`;
          const imageUrl = `/device_image?device_id=${encodeURIComponent(deviceId)}${cacheBust}`;

          let card = existingCards.get(deviceId);
          if (!card) {
            card = document.createElement('button');
            card.type = 'button';
            card.className = 'device-card';
            card.dataset.deviceId = deviceId;

            const imageWrap = document.createElement('div');
            imageWrap.className = 'image-wrap';
            const img = document.createElement('img');
            img.className = 'device-image';
            img.alt = title;
            img.loading = 'eager';
            img.src = imageUrl;
            imageWrap.appendChild(img);
            card.appendChild(imageWrap);

            const titleEl = document.createElement('div');
            titleEl.className = 'title';
            card.appendChild(titleEl);
            const detailA = document.createElement('div');
            detailA.className = 'detail';
            card.appendChild(detailA);
            const detailB = document.createElement('div');
            detailB.className = 'detail';
            card.appendChild(detailB);
          }

          card.className = 'device-card' + (isExpanded ? ' expanded' : '');
          card.dataset.deviceId = deviceId;

          const imageWrap = card.querySelector('.image-wrap');
          const img = card.querySelector('img.device-image');
          if (imageWrap && img) {
            img.src = imageUrl;
            img.alt = title;
          }

          const titleEl = card.querySelector('.title');
          const detailEls = card.querySelectorAll('.detail');
          if (titleEl) titleEl.textContent = title;
          if (detailEls[0]) detailEls[0].textContent = timestamp;
          if (detailEls[1]) detailEls[1].textContent = `${source} • ${signalType}`;

          if (previousCard) {
            if (previousCard.nextSibling !== card) {
              deviceGrid.insertBefore(card, previousCard.nextSibling);
            }
          } else if (deviceGrid.firstChild !== card) {
            deviceGrid.insertBefore(card, deviceGrid.firstChild);
          }

          previousCard = card;
          existingCards.delete(deviceId);
        });

        existingCards.forEach((card) => card.remove());
      }

      function toggleExpanded(deviceId) {
        if (expandedDeviceId === deviceId) {
          expandedDeviceId = null;
        } else {
          expandedDeviceId = deviceId;
        }
        renderDevices(lastPayload?.devices || []);
      }

      let pollInProgress = false;
      const POLL_INTERVAL_MS = 500;
      let lastUpdateKey = '';

      function buildUpdateKey(devices) {
        if (!devices || !devices.length) {
          return '';
        }
        return devices
          .map((device) => `${device.device_id || device.safe_device_id || 'unknown'}:${device.timestamp || ''}`)
          .join('|');
      }

      async function postWebRtcSignal(payload) {
        try {
          const response = await fetch('/webrtc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (!response.ok) {
            throw new Error(`WebRTC signal error ${response.status}`);
          }
          return await response.json();
        } catch (error) {
          console.error(error);
          return null;
        }
      }

      function createDemoWebRtcOffer(deviceId) {
        return {
          type: 'offer',
          sdp: 'v=0\r\no=- 0 0 IN IP4 127.0.0.1\r\ns=-\r\n',
          device_id: deviceId,
          user: { device_id: deviceId },
          source: 'webrtc-browser-signal',
          created_at: new Date().toISOString(),
        };
      }

      async function pollOnce() {
        if (pollInProgress) {
          return;
        }
        pollInProgress = true;
        try {
          const response = await fetch(`/webrtc`, { cache: 'no-store' });
          if (!response.ok) {
            throw new Error(`Status ${response.status}`);
          }

          const data = await response.json();
          const devices = data.devices || [];
          const updateKey = buildUpdateKey(devices);
          if (updateKey !== lastUpdateKey) {
            lastUpdateKey = updateKey;
            lastPayload = data;
            renderDevices(devices);
          }

          if (devices.length) {
            const latest = devices[devices.length - 1];
            meta.textContent = `${devices.length} WebRTC device${devices.length === 1 ? '' : 's'} connected • Last update: ${latest.timestamp || 'n/a'}`;
          } else {
            meta.textContent = 'Waiting for WebRTC signals...';
          }
        } catch (error) {
          meta.textContent = `Waiting for WebRTC signals... ${error.message}`;
        } finally {
          pollInProgress = false;
        }
      }

      function startPolling() {
        pollOnce();
        setInterval(pollOnce, POLL_INTERVAL_MS);
      }

      deviceGrid.addEventListener('click', (event) => {
        const card = event.target.closest('.device-card');
        if (!card) {
          return;
        }
        toggleExpanded(card.dataset.deviceId);
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          expandedDeviceId = null;
          renderDevices(lastPayload?.devices || []);
        }
      });

      const demoDeviceId = 'demo-webrtc-device';
      postWebRtcSignal(createDemoWebRtcOffer(demoDeviceId));

      startPolling();
    </script>
  </body>
</html>
