<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebRTC Local Viewer</title>
    <style>
      body { font-family: Arial, sans-serif; background: #0b1020; color: white; margin: 0; padding: 20px; }
      .panel { max-width: 1200px; margin: auto; }
      .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
      .box { background: #141b2d; border: 1px solid #2a385a; border-radius: 12px; padding: 16px; margin-bottom: 18px; }
      .device-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
      .device-card { background: #0f172a; border: 1px solid #2b3a5a; border-radius: 10px; padding: 10px; color: inherit; text-align: left; }
      .device-card h3 { margin: 0 0 6px; font-size: 1rem; }
      .device-card .meta { color: #8ea3c9; font-size: 0.8rem; }
      .device-card img, .device-card video { width: 100%; display: block; border-radius: 8px; background: #050b16; margin-top: 8px; }
      .delete-btn { margin-top: 10px; width: 100%; border: 1px solid #da3633; background: #3d1214; color: #ffb4b0; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-weight: 600; }
      .delete-btn:hover { background: #5a1a1d; }
      .delete-btn:disabled, .put-btn:disabled { opacity: 0.55; cursor: default; }
      .put-btn { border: 1px solid #1f6feb; background: #12253d; color: #9ecbff; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-weight: 600; flex: 1; }
      .put-btn:hover { background: #1a3354; }
      .action-row { display: flex; gap: 8px; margin-top: 10px; }
      .action-row .delete-btn { margin-top: 0; width: auto; flex: 1; }
      .file-row { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
      .file-input { width: 100%; color: #c9d1d9; font-size: 0.8rem; }
      .file-status { color: #8ea3c9; font-size: 0.78rem; word-break: break-all; }
      .remote { width: 100%; max-height: 520px; background: black; border-radius: 14px; }
      .stream-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
      .json { white-space: pre-wrap; font-size: 12px; background: #050b16; padding: 10px; border-radius: 8px; overflow: auto; }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="toolbar">
        <button id="refreshBtn">Refresh</button>
        <span id="status">Waiting for peers...</span>
      </div>

      <div class="box">
        <h2>Remote stream preview</h2>
        <video id="remoteVideo" class="remote" autoplay playsinline muted controls></video>
      </div>

      <div class="box">
        <h2>Latest captured images</h2>
        <div id="deviceList" class="device-list"></div>
      </div>

      <div class="box">
        <h2>Signaling state</h2>
        <div id="rawState" class="json"></div>
      </div>
    </div>

    <script src="/scripts/viewer.js" defer></script>
    <!-- The browser logic is authored in client/viewer.ts and compiled to scripts/viewer.js. -->

  </body>
</html>
